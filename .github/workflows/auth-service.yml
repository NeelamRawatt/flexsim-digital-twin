name: Auth Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - "auth-service/**"
      - ".github/workflows/auth-service.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flexsim_database
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d flexsim_database"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: auth-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create test schema
        run: |
          PGPASSWORD=testpassword psql \
            -h localhost \
            -U postgres \
            -d flexsim_database \
            -c "CREATE SCHEMA IF NOT EXISTS auth;"

      - name: Build and run tests
        env:
          POSTGRES_PASSWORD: testpassword
          JWT_SECRET: test-secret-key-for-ci-minimum-32-characters
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/flexsim_database
          SPRING_DATASOURCE_USERNAME: postgres
        run: ./mvnw clean verify

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/auth-service" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          file: ./auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}