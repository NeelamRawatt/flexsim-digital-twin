name: Auth Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'auth-service/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flexsim_database
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: auth-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Create test schema
        run: PGPASSWORD=testpassword psql -h localhost -U postgres -d flexsim_database -c "CREATE SCHEMA IF NOT EXISTS auth;"

      - name: Build and run tests
        env:
          POSTGRES_PASSWORD: testpassword
        run: ./mvnw clean verify

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/auth-service:latest