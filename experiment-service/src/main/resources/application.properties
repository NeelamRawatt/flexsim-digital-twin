spring.application.name=experiment-service
server.port = 8082
spring.datasource.url=jdbc:postgresql://localhost:5432/flexsim-database
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}

spring.flyway.enabled=true
spring.flyway.schemas=experiment
spring.flyway.locations=classpath:db/migration



spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000


spring.jpa.properties.hibernate.default_schema=experiment
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}

services.auth.base-url=http://localhost:8081

