spring.application.name=file-service
server.port = 8083
spring.datasource.url=jdbc:postgresql://localhost:5432/flexsim-database
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}

jwt.secret=${JWT_SECRET}

spring.flyway.enabled=true
spring.flyway.schemas=file
spring.flyway.locations=classpath:db/migration



spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000


spring.jpa.properties.hibernate.default_schema=file
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false


# Without these two lines, Spring Boot rejects any file over 1MB by default —
# a real Excel infeed file can easily be bigger than that.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB